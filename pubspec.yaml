name: flutter_koin

description: A lightweight dependency injection library for Flutter with code generation, scoped lifecycles, and constructor injection.

version: 1.0.0

# homepage: https://github.com/ProstoAndr/flutter_koin
# repository: https://github.com/ProstoAndr/flutter_koin
# issue_tracker: https://github.com/ProstoAndr/flutter_koin/issues

topics:
  - dependency-injection
  - code-generation
  - service-locator
  - scopes
  - flutter

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  build: ^4.0.4
  source_gen: ^4.1.2
  analyzer: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.12.2
  build_test: ^3.5.10
  test: ^1.31.0
